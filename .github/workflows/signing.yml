name: Approved free signing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sign:
    if: github.event.repository.private == false && vars.SIGNPATH_APPROVED == 'true'
    environment: release-signing
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source checks
        run: python scripts/validate_source.py
      - name: Configure native build after provider approval
        run: cmake -S . -B build -A x64 -DPWC_BUILD_NATIVE_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Run isolated policy tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage this build's helper only
        run: |
          New-Item -ItemType Directory -Path signing-input | Out-Null
          Copy-Item -LiteralPath build/Release/PackWeaponCondition.dll -Destination signing-input/PackWeaponCondition.dll
      - name: Upload trusted build artifact
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helper-for-approved-signing
          path: signing-input/PackWeaponCondition.dll
          if-no-files-found: error
          retention-days: 1
      - name: Request the approved free signature
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: signed
          parameters: |
            version: "0.2.0.0"
      - name: Verify normal Windows Authenticode validation
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -LiteralPath signed/PackWeaponCondition.dll
          if ($sig.Status -ne 'Valid') { throw 'Signed artifact did not pass Windows validation' }
      - name: Preserve signed artifact for maintainer review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-helper-for-review
          path: signed/PackWeaponCondition.dll
          if-no-files-found: error
          retention-days: 1
